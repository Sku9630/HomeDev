<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeDev - Game Developer 2D</title>
    <!-- Google Fonts untuk tampilan modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b132b;
            color: #ffffff;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- HEADER & NAVBAR --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(11, 19, 43, 0.95);
            backdrop-filter: blur(8px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #00d8ff;
        }

        .logo span {
            color: #ffffff;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.95rem;
            font-weight: 500;
            color: #d1d5db;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #00d8ff;
        }

        /* Hamburger Icon (Mobile) */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: #ffffff;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 120px 20px 60px;
            background: linear-gradient(180deg, rgba(11, 19, 43, 0.7) 0%, rgba(11, 19, 43, 1) 100%),
                        radial-gradient(circle at center, rgba(0, 216, 255, 0.15) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .hero h1 span {
            color: #00d8ff;
        }

        .hero p {
            font-size: 1.05rem;
            color: #9ca3af;
            max-width: 650px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .cta-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 32px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #00d8ff;
            color: #0b132b;
            border: 2px solid #00d8ff;
        }

        .btn-primary:hover {
            background-color: #00b4d8;
            border-color: #00b4d8;
            box-shadow: 0 0 15px rgba(0, 216, 255, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-secondary:hover {
            background-color: #ffffff;
            color: #0b132b;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* --- RESPONSIVE MEDIA QUERIES (LAYAR HP) --- */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #0b132b;
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 25px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                display: none; /* Sembunyi secara default di HP */
            }

            .nav-links.active {
                display: flex; /* Muncul saat hamburger diklik */
            }

            .hero h1 {
                font-size: 2.1rem;
            }

            .hero p {
                font-size: 0.95rem;
            }

            .cta-buttons {
                flex-direction: column;
                width: 100%;
                max-width: 280px;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR / HEADER -->
    <header>
        <nav class="navbar">
            <a href="#" class="logo">
                <span>Home</span>Dev
            </a>

            <!-- Menu Komputer -->
            <ul class="nav-links" id="navLinks">
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Games</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <!-- Tombol Hamburger Mobile -->
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Creating Amazing <span>2D Games</span></h1>
        <p>
            HomeDev adalah developer game 2D Indonesia yang menghadirkan permainan ringan, seru, dan kreatif dengan sentuhan budaya Nusantara.
        </p>
        <div class="cta-buttons">
            <a href="#" class="btn btn-primary">Our Games</a>
            <a href="#" class="btn btn-secondary">Download</a>
        </div>
    </section>

    <!-- JAVASCRIPT UNTUK MENU HP -->
    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
    </html>
